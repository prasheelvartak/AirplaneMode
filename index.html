<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirplaneMode — Personal Flight Tracker & Route Analytics</title>
  <meta name="description" content="AirplaneMode is a luxury flight tracking and global route visualization web application for myflightradar24 data, fleet history, and aviation analytics.">
  
  <!-- Favicon icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">

  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Main Custom Styling -->
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Application Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo">✈️</div>
        <div class="brand-text">
          <h1>AirplaneMode <span class="brand-tag">v1.1</span></h1>
          <p>Personal Flight Intelligence & Route Analytics</p>
        </div>
      </div>

      <!-- Live Header Quick KPIs -->
      <div class="header-kpi-bar">
        <div class="h-kpi">
          <span class="kpi-label">Flights:</span>
          <span id="stat-header-flights" class="kpi-value">0</span>
        </div>
        <div class="h-kpi-sep"></div>
        <div class="h-kpi">
          <span class="kpi-label">Distance:</span>
          <span id="stat-header-dist" class="kpi-value">0 km</span>
        </div>
        <div class="h-kpi-sep"></div>
        <div class="h-kpi">
          <span class="kpi-label">Air Time:</span>
          <span id="stat-header-airtime" class="kpi-value">0h</span>
        </div>
        <div class="h-kpi-sep"></div>
        <div class="h-kpi">
          <span class="kpi-label">Airports:</span>
          <span id="stat-header-airports" class="kpi-value">0</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="header-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light/Dark Theme" onclick="window.app.toggleTheme()">
          ☀️
        </button>
        <button class="btn btn-secondary btn-sm" onclick="window.app.openImportModal()">
          📥 Import CSV
        </button>
        <button class="btn btn-primary btn-sm" onclick="window.app.openAddFlightModal()">
          ➕ Log Flight
        </button>
      </div>
    </header>

    <!-- Navigation Tabs Bar -->
    <nav class="nav-tab-bar" aria-label="Main Navigation">
      <button class="nav-tab-btn active" data-tab="map" id="tab-btn-map">
        🌐 Global Route Map
      </button>
      <button class="nav-tab-btn" data-tab="analytics" id="tab-btn-analytics">
        📊 Flight Analytics
      </button>
      <button class="nav-tab-btn" data-tab="flights" id="tab-btn-flights">
        ✈️ Flight Log & Explorer
      </button>
      <button class="nav-tab-btn" data-tab="aircraft" id="tab-btn-aircraft">
        🛩️ Plane & Fleet Registry
      </button>
      <button class="nav-tab-btn" data-tab="io" id="tab-btn-io">
        💾 Data & Backup
      </button>
    </nav>

    <!-- Main View Panes Container -->
    <main class="app-main">

      <!-- ========================================== -->
      <!-- TAB 1: Global Route Map View               -->
      <!-- ========================================== -->
      <section class="tab-pane active" id="tab-map">
        <div id="flight-map-view" class="map-container"></div>
        
        <!-- Floating Map Options & Legend Overlay -->
        <div class="map-floating-overlay" id="map-control-overlay">
          
          <!-- Mobile Expand/Collapse Pill Trigger -->
          <button class="map-mobile-toggle-btn" id="map-mobile-toggle-btn" onclick="window.app.toggleMobileMapControls()">
            <span class="m-toggle-icon">🎛️</span>
            <span class="m-toggle-text">Map Controls</span>
            <span id="map-mobile-pill" class="map-routes-pill">0 Flights</span>
          </button>

          <div class="glass-card map-control-card" id="map-control-card">
            
            <div class="map-card-header">
              <div class="map-card-title">
                <span>🌐 Route Intelligence</span>
              </div>
              <div class="flex items-center gap-2">
                <span id="map-active-routes-pill" class="map-routes-pill">0 Flights</span>
                <button class="map-card-close-mobile-btn" onclick="window.app.toggleMobileMapControls(false)" aria-label="Close Map Controls">✕</button>
              </div>
            </div>

            <!-- Filter by Airline Dropdown -->
            <div class="map-control-section">
              <span class="map-control-label">
                <span>Filter By Airline</span>
                <small id="map-airline-clear-btn" class="text-cyan cursor-pointer" style="display:none;" onclick="window.app.clearMapAirlineFilter()">Clear</small>
              </span>
              <div class="map-airline-select-wrap">
                <select id="map-airline-select" class="map-airline-select" onchange="window.app.onMapAirlineFilterChanged(this.value)">
                  <option value="all">✈️ All Airlines (Global)</option>
                </select>
                <span class="map-select-arrow">▼</span>
              </div>
            </div>

            <!-- Route Colors Toggle -->
            <div class="map-control-section">
              <span class="map-control-label">Route Colors</span>
              <div class="segmented-mode-ctrl">
                <button class="segment-btn route-color-btn active" data-mode="airline" onclick="window.app.setRouteColorMode('airline')">
                  🎨 Airline
                </button>
                <button class="segment-btn route-color-btn" data-mode="cyan" onclick="window.app.setRouteColorMode('cyan')">
                  💎 Cyan Glow
                </button>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- App JS -->
  <script src="js/app.js"></script>
</body>
</html>
